<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>403 접근 권한 없음 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .error-box {
            max-width: 640px;
            margin: 120px auto 0;
        }

        .error-code {
            font-size: 5rem;
            font-weight: 800;
            color: #e94560;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="error-box text-center">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-5">
                <div class="error-code">403</div>

                <h3 class="fw-bold mb-3">접근 권한이 없습니다</h3>

                <p class="text-muted mb-4">
                    관리자(ADMIN)만 접근할 수 있는 페이지입니다.
                </p>

                <a th:href="@{/products}" class="btn btn-primary px-4">상품 목록으로 돌아가기</a>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 mb-3 text-muted small">
    학번: 2371080 | 성명: 홍태성 | 실습 수행:
    <span id="practiceTime"></span>
</footer>

<script>
    function updatePracticeTime() {
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');

        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const day = days[now.getDay()];

        let hour = now.getHours();
        const ampm = hour >= 12 ? '오후' : '오전';
        hour = hour % 12;
        if (hour === 0) hour = 12;

        const minute = String(now.getMinutes()).padStart(2, '0');
        const second = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('practiceTime').textContent =
            `${year}년 ${month}월 ${date}일 (${day}) ${ampm} ${String(hour).padStart(2, '0')}:${minute}:${second}`;
    }

    updatePracticeTime();
    setInterval(updatePracticeTime, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
