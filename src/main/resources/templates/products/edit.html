<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 수정 - HanSung</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .navbar {
            background: linear-gradient(90deg, #1a1a2e, #0f3460);
        }

        .navbar-brand {
            font-weight: 800;
            color: #e94560 !important;
            font-size: 1.4rem;
        }

        .page-header {
            border-left: 4px solid #e94560;
            padding-left: 1rem;
        }

        .form-card {
            max-width: 760px;
            margin: 0 auto;
        }

        .btn-main {
            background-color: #e94560;
            border-color: #e94560;
            color: #fff;
        }

        .btn-main:hover {
            background-color: #d63350;
            border-color: #d63350;
            color: #fff;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">HanSung</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">홈</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/products}">상품 목록</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/products/add}">상품 등록</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">관리자</a>
                </li>
            </ul>

            <form th:action="@{/logout}" method="post" class="d-flex">
                <button class="btn btn-outline-light btn-sm px-3">로그아웃</button>
            </form>
        </div>
    </div>
</nav>

<div class="container">
    <div class="form-card">
        <div class="page-header mb-4">
            <h4 class="fw-bold mb-1">상품 수정</h4>
            <small class="text-muted">기존 상품 정보를 수정합니다.</small>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/products/{id}/edit(id=${productId})}"
                      th:object="${productDto}"
                      method="post">

                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">상품명 *</label>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="상품명을 입력하세요">

                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('name')}"
                             th:errors="*{name}">
                            상품명 오류
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="price" class="form-label fw-semibold">가격 *</label>
                        <div class="input-group">
                            <input type="number"
                                   id="price"
                                   th:field="*{price}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                                   min="0"
                                   placeholder="가격을 입력하세요">
                            <span class="input-group-text">원</span>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('price')}"
                                 th:errors="*{price}">
                                가격 오류
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="stock" class="form-label fw-semibold">재고 수량 *</label>
                        <div class="input-group">
                            <input type="number"
                                   id="stock"
                                   th:field="*{stock}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'"
                                   min="0"
                                   placeholder="재고 수량을 입력하세요">
                            <span class="input-group-text">개</span>

                            <div class="invalid-feedback"
                                 th:if="${#fields.hasErrors('stock')}"
                                 th:errors="*{stock}">
                                재고 오류
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="description" class="form-label fw-semibold">상품 설명</label>
                        <textarea id="description"
                                  th:field="*{description}"
                                  class="form-control"
                                  rows="4"
                                  placeholder="상품 설명을 입력하세요"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a th:href="@{/products}" class="btn btn-outline-secondary px-4">취소</a>
                        <button type="submit" class="btn btn-main px-4">수정 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<footer class="text-center mt-5 mb-3 text-muted small">
    학번: 2371080 | 성명: 홍태성 | 실습 수행:
    <span id="practiceTime"></span>
</footer>

<script>
    function updatePracticeTime() {
        const now = new Date();

        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const date = String(now.getDate()).padStart(2, '0');

        const days = ['일', '월', '화', '수', '목', '금', '토'];
        const day = days[now.getDay()];

        let hour = now.getHours();
        const ampm = hour >= 12 ? '오후' : '오전';
        hour = hour % 12;
        if (hour === 0) hour = 12;

        const minute = String(now.getMinutes()).padStart(2, '0');
        const second = String(now.getSeconds()).padStart(2, '0');

        document.getElementById('practiceTime').textContent =
            `${year}년 ${month}월 ${date}일 (${day}) ${ampm} ${String(hour).padStart(2, '0')}:${minute}:${second}`;
    }

    updatePracticeTime();
    setInterval(updatePracticeTime, 1000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
